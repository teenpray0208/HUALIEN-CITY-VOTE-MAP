  <style>

    h1{font-size:19px;margin:0 0 3px;letter-spacing:.02em}.subtitle{font-size:11px;opacity:.85}.header-actions{display:flex;align-items:center;gap:8px}.mode-label{font-size:12px;opacity:.8}.mode-btn{border:1px solid #ffffffaa;background:#ffffff14;color:white;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.mode-btn.active{background:#fff;color:#087392}.mode-btn:focus-visible,.search:focus-visible{outline:3px solid #f8cf61;outline-offset:2px}
    #map{height:calc(100% - 64px);width:100%}.leaflet-container{font-family:inherit;background:#dceaf7}.leaflet-control-attribution{font-size:9px}
    .panel{position:absolute;z-index:700;background:#fff;border:1px solid #dbe5ee;border-radius:12px;box-shadow:0 8px 24px #16334c25}.summary{left:14px;top:78px;width:278px;padding:14px}.summary h2,.legend h2{font-size:14px;margin:0 0 11px;color:#216a72}.summary h2{border-bottom:2px solid #58a4a5;padding-bottom:7px}.candidate{margin:10px 0}.candidate-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px}.candidate strong{font-size:15px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:inset 0 0 0 1px #0002}.bar{height:5px;background:#e8eef4;border-radius:10px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px}.note{font-size:10px;color:#8693a1;text-align:center;margin-top:10px;border-top:1px solid #eef2f6;padding-top:8px;line-height:1.45}

    .legend{right:14px;top:78px;width:274px;overflow:visible}.legend-inner{padding:14px}.legend-row{font-size:12px;margin:8px 0;display:flex;align-items:center;gap:8px}.swatch{width:13px;height:13px;border-radius:3px;flex:0 0 auto}.search-wrap{position:relative;margin:10px 0 2px}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px}.detail{min-height:105px;padding:14px;border-top:1px solid var(--line)}.empty{text-align:center;color:#8795a4;font-size:12px;line-height:1.8;padding:7px}.empty b{font-size:26px;display:block}.detail h3{margin:0 0 8px;font-size:17px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.detail-grid div{border-radius:7px;background:#f4f7fa;padding:7px 5px;text-align:center;font-size:10px}.detail-grid strong{font-size:14px;display:block;margin-bottom:2px}.winner{font-size:11px;background:#eef7f5;border-radius:7px;padding:7px;margin:8px 0;color:#37605e}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stats div{text-align:center;padding:9px 2px;font-size:9px;color:var(--muted);border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats strong{font-size:16px;display:block;margin-bottom:2px}
    .rank{position:absolute;z-index:650;left:14px;bottom:20px;width:300px;background:#ffffffed;border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:0 8px 24px #16334c25;backdrop-filter:blur(8px)}.rank h3{font-size:12px;margin:0 0 3px}.rank-total{font-size:10px;color:#5b6e80;margin-bottom:8px}.rank-list{display:grid;gap:3px;max-height:48vh;overflow-y:auto;padding-right:4px;scrollbar-width:thin}.rank-item{display:grid;grid-template-columns:22px 1fr auto;gap:5px;align-items:center;font-size:10px}.rank-item .mini{height:4px;background:#e9eef3;border-radius:4px;overflow:hidden}.rank-item .mini i{height:100%;display:block}.loading{position:fixed;inset:64px 0 0;background:#eaf1f7;z-index:900;display:grid;place-items:center;color:#3b7181}.loading-card{background:white;padding:18px 24px;border-radius:12px;box-shadow:0 10px 30px #2342}.spinner{width:28px;height:28px;border:3px solid #dce8ee;border-top-color:#0b7d90;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .rank-item{border:0;background:transparent;padding:3px 2px;width:100%;text-align:left;cursor:pointer;color:inherit;border-radius:5px}.rank-item:hover,.rank-item:focus-visible{background:#e8f4f5;outline:none}.rank-hint{font-size:9px;color:#7a8998;margin-top:6px;text-align:center}
    .modal{position:fixed;inset:0;background:#0f2943a8;z-index:2000;display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.modal-card{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px #071d35aa}.modal-head{position:sticky;top:0;background:linear-gradient(120deg,#0a7477,#087ba5);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modal-head h2{margin:0;font-size:20px}.modal-close{border:0;background:#ffffff24;color:#fff;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer}.modal-body{padding:16px}.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.analysis-card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#f8fafc}.analysis-card h3{font-size:13px;margin:0 0 9px}.analysis-row{display:flex;justify-content:space-between;font-size:11px;margin:6px 0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{background:#eef7f7;border-radius:10px;padding:12px;text-align:center;font-size:11px}.metric strong{display:block;font-size:23px;color:#087b88;margin:4px}.agebar{height:12px;display:flex;border-radius:8px;overflow:hidden;margin:10px 0}.agebar i:nth-child(1){background:#20a8d8}.agebar i:nth-child(2){background:#e0a12c}.agebar i:nth-child(3){background:#728097}.method{font-size:10px;color:#6f7e8c;line-height:1.55;background:#f3f5f7;padding:10px;border-radius:8px;margin-top:12px}.tpp-estimate{border:2px solid #20a8d8;background:#edfaff}.tpp-estimate strong{color:#1689b5}
    .modal-card{width:min(980px,96vw)}.analysis-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}.village-preview{position:sticky;top:62px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f5f8fa}.village-preview h3{font-size:12px;margin:0;padding:10px;background:#eef4f7}.mini-map{height:270px;width:100%;background:#dceaf7}.preview-note{padding:8px 10px;color:#6d7d8c;font-size:9px;line-height:1.4}
    button.metric{border:0;font:inherit;color:inherit;cursor:pointer;width:100%}button.metric:hover,button.metric:focus-visible{outline:3px solid #56aeb7;outline-offset:2px;transform:translateY(-1px)}.tpp-row{display:grid;grid-template-columns:1fr;margin-top:10px}.tpp-row .metric{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:left}.tpp-row .metric strong{text-align:center}.tpp-row .metric small{text-align:right}.metric-popover{position:absolute;inset:10% 8%;z-index:6;background:#fff;border-radius:14px;box-shadow:0 18px 60px #08223dcc;border:1px solid var(--line);overflow:auto}.metric-popover[hidden]{display:none}.metric-popover-head{background:#edf5f7;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.metric-popover-head h3{margin:0;font-size:16px}.metric-popover-close{border:0;background:#dce9ed;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer}.metric-popover-body{padding:15px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px}.breakdown-card{border:1px solid var(--line);border-radius:10px;padding:12px}.breakdown-card h4{margin:0 0 10px;font-size:12px}.ratio-row{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:11px;margin:9px 0}.ratio-bar{height:8px;background:#e8edf1;border-radius:6px;overflow:hidden}.ratio-bar i{display:block;height:100%;background:#20a8d8;border-radius:6px}.ratio-row.female .ratio-bar i{background:#e879a6}
    .leaflet-tooltip.village-label{background:transparent;border:0;box-shadow:none;color:#214056;font-size:10px;font-weight:700;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}.leaflet-tooltip-top:before{display:none}
    @media(max-width:760px){header{height:auto;min-height:86px;align-items:flex-start;flex-direction:column;padding:9px 12px}.header-actions{width:100%}.mode-label{display:none}.mode-btn{flex:1;padding:6px 8px;font-size:11px}#map{height:calc(100% - 86px)}.summary{top:98px;left:8px;width:210px;padding:10px}.summary h2{font-size:12px}.candidate{margin:7px 0}.candidate strong{font-size:12px}.legend{top:auto;bottom:10px;right:8px;width:205px}.legend-inner{padding:10px}.legend-inner h2,.legend-row{display:none}.search-wrap{margin:0}.detail{min-height:80px;padding:9px}.stats{display:none}.rank{display:none}.loading{inset:86px 0 0}.analysis-grid,.metric-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-body{padding:10px}}
    @media(max-width:760px){.analysis-layout{grid-template-columns:1fr}.village-preview{position:static;order:-1}.mini-map{height:190px}}
  </style>

<body>
<div id="app">
  <header>
    <div><h1>🗳️ 花蓮市各里投票分布地圖</h1><div class="subtitle">2024 第16任總統副總統選舉｜花蓮市 44 里互動檢視</div></div>
    <div class="header-actions"><span class="mode-label">選舉：</span><button class="mode-btn" data-year="2022">2022 縣長</button><button class="mode-btn active" data-year="2024">2024 總統</button><button class="mode-btn" data-year="2026">2026 預估</button></div>
  </header>
  <div id="map" aria-label="花蓮市各里投票分布互動地圖"></div>
  <section class="panel summary" id="summary-panel" aria-label="花蓮市總得票">
    <button class="collapse-toggle collapse-left" data-panel="summary-panel" data-side="left" aria-label="向左收起花蓮市總得票" aria-expanded="true">‹</button>
    <h2 id="summary-title">🏛️ 花蓮市 2024 總統票</h2>
    <div id="city-summary"></div>
    <div class="note" id="data-note"></div>
  </section>
  <aside class="panel legend" id="legend-panel" aria-label="圖例與里別資訊">
    <button class="collapse-toggle collapse-right" data-panel="legend-panel" data-side="right" aria-label="向右收起圖例與里別資訊" aria-expanded="true">›</button>
    <div class="legend-inner"><h2>圖例</h2><div id="legend-items"></div><div class="search-wrap"><input id="search" class="search" list="villages" placeholder="搜尋里名，例如：國富里" aria-label="搜尋里名"><datalist id="villages"></datalist></div></div>
    <div class="detail" id="detail"><div class="empty"><b>☝️</b>點擊地圖上的里<br>查看三組候選人票數與比例</div></div>
    <div class="stats" id="stats"></div>
  </aside>
  <section class="rank" id="rank-panel" aria-label="民眾黨各里得票明細"><button class="collapse-toggle collapse-left" data-panel="rank-panel" data-side="left" aria-label="向左收起民眾黨各里得票明細" aria-expanded="true">‹</button><h3 id="rank-title">2024 民眾黨 44 里得票明細</h3><div class="rank-total" id="rank-total">花蓮市合計 14,116 票・依票數排序</div><div class="rank-list" id="rank-list"></div><div class="rank-hint">上下捲動查看全部・移入定位・點擊分析</div></section>
  <div class="loading" id="loading"><div class="loading-card"><div class="spinner"></div>載入花蓮市村里界…</div></div>
  <div class="modal" id="analysis-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><article class="modal-card" style="position:relative"><header class="modal-head"><h2 id="modal-title">里別投票分析</h2><button class="modal-close" id="modal-close" aria-label="關閉分析視窗">×</button></header><div class="modal-body" id="modal-body"></div><section class="metric-popover" id="metric-popover" hidden role="dialog" aria-modal="true" aria-labelledby="metric-popover-title"><header class="metric-popover-head"><h3 id="metric-popover-title">細項資訊</h3><button class="metric-popover-close" id="metric-popover-close" aria-label="關閉細項資訊">×</button></header><div class="metric-popover-body" id="metric-popover-body"></div></section></article></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATASETS={
  2022:{title:'花蓮市 2022 縣長票',subtitle:'2022 花蓮縣長選舉｜花蓮市 44 里實際開票',note:'實際結果｜資料來源：中央選舉委員會／VoteTW 里級彙整。',candidates:{kmt:{short:'徐榛蔚',party:'中國國民黨',color:'#2563a9'},other:{short:'黃師鵬',party:'無黨籍',color:'#7c8795'},dpp:{short:'Kolas',party:'民主進步黨',color:'#1d9b63'}}},
  2024:{title:'花蓮市 2024 總統票',subtitle:'2024 第16任總統副總統選舉｜花蓮市 44 里實際開票',note:'實際結果｜資料來源：中央選舉委員會／VoteTW 里級彙整。',candidates:{kmt:{short:'侯友宜',party:'中國國民黨',color:'#2563a9'},dpp:{short:'賴清德',party:'民主進步黨',color:'#1d9b63'},tpp:{short:'柯文哲',party:'台灣民眾黨',color:'#20a8d8'}}},
  2026:{title:'花蓮市 2026 選情預估',subtitle:'2026 花蓮地方選舉預估｜藍、綠、白各自參選（無藍白合）',note:'模型推估，非民調｜綜合 2022 縣長與 2024 總統各里政黨基礎；假設藍、綠、白各自參選。',candidates:{kmt:{short:'國民黨',party:'中國國民黨',color:'#2563a9'},dpp:{short:'民進黨',party:'民主進步黨',color:'#1d9b63'},tpp:{short:'民眾黨',party:'台灣民眾黨',color:'#20a8d8'}}}
};
const state={year:'2024',selected:null,layers:new Map(),records:[],allData:{},miniMap:null,fullBounds:null};
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([23.991,121.611],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const fmt=n=>new Intl.NumberFormat('zh-TW').format(n); const pct=(n,d)=>(n/d*100).toFixed(1)+'%';
const candidates=()=>DATASETS[state.year].candidates;
function enrich(name,votes){const keys=Object.keys(votes),total=keys.reduce((s,k)=>s+votes[k],0),winner=[...keys].sort((a,b)=>votes[b]-votes[a])[0],vals=keys.map(k=>votes[k]).sort((a,b)=>b-a);return{name,...votes,total,winner,margin:(vals[0]-vals[1])/total}}
function project2026(name,v22,v24){const t22=v22.kmt+v22.other+v22.dpp,t24=v24.kmt+v24.dpp+v24.tpp;const scores={kmt:.58*v24.kmt/t24+.42*v22.kmt/t22,dpp:.58*v24.dpp/t24+.42*v22.dpp/t22,tpp:.78*v24.tpp/t24};const den=Object.values(scores).reduce((a,b)=>a+b,0),total=Math.round(t24*.94);const votes={kmt:Math.round(total*scores.kmt/den),dpp:Math.round(total*scores.dpp/den),tpp:0};votes.tpp=total-votes.kmt-votes.dpp;return enrich(name,votes)}
function recordsFor(year,names){if(year==='2026')return names.map(n=>project2026(n,state.allData['2022'][n],state.allData['2024'][n]));const keys=Object.keys(DATASETS[year].candidates);return names.map(n=>enrich(n,Object.fromEntries(keys.map(k=>[k,state.allData[year][n][k]]))))}
function renderSummary(){const cs=candidates(),total=state.records.reduce((s,r)=>s+r.total,0),totals=Object.fromEntries(Object.keys(cs).map(k=>[k,state.records.reduce((s,r)=>s+r[k],0)]));document.querySelector('#summary-title').textContent='🏛️ '+DATASETS[state.year].title;document.querySelector('.subtitle').textContent=DATASETS[state.year].subtitle;document.querySelector('#data-note').textContent=DATASETS[state.year].note;document.querySelector('#city-summary').innerHTML=Object.entries(cs).map(([k,c])=>`<div class="candidate"><div class="candidate-row"><span><i class="dot" style="background:${c.color}"></i>${c.party}</span><span><strong style="color:${c.color}">${fmt(totals[k])}</strong> 票・${pct(totals[k],total)}</span></div><div class="bar"><i style="width:${pct(totals[k],total)};background:${c.color}"></i></div></div>`).join('')}
function renderVillageSummary(r){const cs=candidates();document.querySelector('#summary-title').textContent=`🏘️ ${r.name} ${state.year==='2026'?'選情預估':'投票結果'}`;document.querySelector('#data-note').textContent=state.year==='2026'?`${r.name}模型推估，非民調。`:`${r.name}${state.year}實際里級結果。`;document.querySelector('#city-summary').innerHTML=Object.entries(cs).map(([k,c])=>`<div class="candidate"><div class="candidate-row"><span><i class="dot" style="background:${c.color}"></i>${c.party}</span><span><strong style="color:${c.color}">${fmt(r[k])}</strong> 票・${pct(r[k],r.total)}</span></div><div class="bar"><i style="width:${pct(r[k],r.total)};background:${c.color}"></i></div></div>`).join('')}
function colorFor(r){return candidates()[r.winner].color}
function renderLegend(){document.querySelector('#legend-items').innerHTML=Object.values(candidates()).map(c=>`<div class="legend-row"><i class="swatch" style="background:${c.color}"></i>${c.short}領先</div>`).join('')}
function renderDetail(r){state.selected=r;const cs=candidates(),sorted=Object.keys(cs).sort((a,b)=>r[b]-r[a]);document.querySelector('#detail').innerHTML=`<h3>${r.name}</h3><div class="winner">${cs[r.winner].party}領先・勝出幅度 ${(r.margin*100).toFixed(1)}%${state.year==='2026'?'（模型預估）':''}</div><div class="detail-grid">${sorted.map(k=>`<div><strong style="color:${cs[k].color}">${fmt(r[k])}</strong>${cs[k].short}<br>${pct(r[k],r.total)}</div>`).join('')}</div>`}
function renderStats(){const cs=candidates(),wins=Object.fromEntries(Object.keys(cs).map(k=>[k,0]));state.records.forEach(r=>wins[r.winner]++);document.querySelector('#stats').innerHTML=Object.keys(cs).map(k=>`<div><strong style="color:${cs[k].color}">${wins[k]}</strong>${cs[k].short}領先</div>`).join('')}
function renderRank(){const rows=recordsFor('2024',Object.keys(state.allData['2024'])).sort((a,b)=>b.tpp-a.tpp),total=rows.reduce((s,r)=>s+r.tpp,0);document.querySelector('#rank-total').textContent=`花蓮市合計 ${fmt(total)} 票・共 ${rows.length} 里・依票數排序`;document.querySelector('#rank-list').innerHTML=`<button class="rank-item total-view" data-village="__total" title="回到花蓮市總表"><b>Σ</b><span><strong>總表</strong><span class="mini"><i style="width:100%;background:#0a7d86"></i></span></span><strong>${fmt(total)}票</strong></button>`+rows.map((r,i)=>`<button class="rank-item" data-village="${r.name}" title="${r.name}：民眾黨 ${fmt(r.tpp)} 票，得票率 ${pct(r.tpp,r.total)}"><b>${i+1}</b><span>${r.name}<span class="mini"><i style="width:${pct(r.tpp,r.total)};background:#20a8d8"></i></span></span><strong>${fmt(r.tpp)}票・${pct(r.tpp,r.total)}</strong></button>`).join('');document.querySelectorAll('.rank-item').forEach(el=>{const totalView=el.dataset.village==='__total';el.addEventListener('mouseenter',()=>totalView?showTotalView():focusVillage(el.dataset.village));el.addEventListener('focus',()=>totalView?showTotalView():focusVillage(el.dataset.village));el.addEventListener('click',()=>totalView?showTotalView():openVillageAnalysisV2(el.dataset.village))})}
function focusVillage(name){const layer=state.layers.get(name),r=state.records.find(x=>x.name===name);if(!layer||!r)return;state.selected=r;map.flyToBounds(layer.getBounds(),{maxZoom:15,padding:[70,70],duration:.45});state.layers.forEach(l=>l.setStyle({weight:1.2,color:'#fff',fillOpacity:.76}));layer.bringToFront();layer.setStyle({weight:4,color:'#f59e0b',fillOpacity:.9});renderVillageSummary(r);renderDetail(r)}
function showTotalView(){state.selected=null;if(state.fullBounds)map.flyToBounds(state.fullBounds,{padding:[20,20],duration:.45});state.layers.forEach(l=>l.setStyle({weight:1.2,color:'#fff',fillOpacity:.76}));renderSummary();document.querySelector('#detail').innerHTML='<div class="empty"><b>📊</b>花蓮市總表<br>移到左下任一里查看該里資料</div>'}
function voteRows(r,cs){return Object.keys(cs).sort((a,b)=>r[b]-r[a]).map(k=>`<div class="analysis-row"><span><i class="dot" style="background:${cs[k].color}"></i>${cs[k].short}</span><b>${fmt(r[k])}・${pct(r[k],r.total)}</b></div>`).join('')}
function openVillageAnalysis(name){const r22=recordsFor('2022',[name])[0],r24=recordsFor('2024',[name])[0],r26=recordsFor('2026',[name])[0],meta=state.allData['2022'][name];const tpp24=r24.tpp/r24.total,young=Math.max(.20,Math.min(.31,.25+(tpp24-.256)*.35)),middle=.34,senior=1-young-middle;const firstTime=Math.round(meta.electors*.048),potential=r26.tpp/r26.total,low=Math.max(0,potential-.04),high=Math.min(1,potential+.04),body=document.querySelector('#modal-body');document.querySelector('#modal-title').textContent=name+'｜投票與選民分析';body.innerHTML=`<div class="analysis-layout"><div class="analysis-main"><div class="analysis-grid"><section class="analysis-card"><h3>2022 花蓮縣長・實際</h3>${voteRows(r22,DATASETS['2022'].candidates)}<div class="analysis-row"><span>投票率</span><b>${meta.turnout.toFixed(1)}%</b></div></section><section class="analysis-card"><h3>2024 總統・實際</h3>${voteRows(r24,DATASETS['2024'].candidates)}</section><section class="analysis-card"><h3>2026 無藍白合・預估</h3>${voteRows(r26,DATASETS['2026'].candidates)}</section></div><div class="metric-grid"><div class="metric"><span>2022 選舉人數</span><strong>${fmt(meta.electors)}人</strong><small>官方登記選舉人</small></div><div class="metric"><span>2026 首次地方選舉族群</span><strong>約 ${fmt(firstTime)}人</strong><small>推估約占 4.8%</small></div><div class="metric tpp-estimate"><span>可能投民眾黨</span><strong>${pct(r26.tpp,r26.total)}</strong><small>合理區間 ${pct(low,1)}–${pct(high,1)}</small></div></div><section class="analysis-card" style="margin-top:12px"><h3>選民年齡結構（模型估計）</h3><div class="agebar"><i style="width:${young*100}%"></i><i style="width:${middle*100}%"></i><i style="width:${senior*100}%"></i></div><div class="analysis-row"><span>🔵 20–39 歲</span><b>${pct(young,1)}・約 ${fmt(Math.round(meta.electors*young))}人</b></div><div class="analysis-row"><span>🟠 40–59 歲</span><b>${pct(middle,1)}・約 ${fmt(Math.round(meta.electors*middle))}人</b></div><div class="analysis-row"><span>⚫ 60 歲以上</span><b>${pct(senior,1)}・約 ${fmt(Math.round(meta.electors*senior))}人</b></div></section><div class="method"><b>估算方式：</b>2022、2024 票數及 2022 選舉人數為實際資料；年齡結構與首投族為模型估計。首投族以 2022 選舉人數的 4.8% 估算 2026 年首次參與地方選舉者。民眾黨潛在比例以該里 2024 實際白營得票、2022 地方選舉結構及常見民調年齡梯度（20–29 歲約25%、30–39歲約20%、40–49歲約13%、50–59歲約7%、60歲以上約2%）加權，並呈現 ±4 個百分點區間；不是個人層級預測或民調。</div></div><aside class="village-preview"><h3>📍 ${name}位置縮圖</h3><div id="mini-map" class="mini-map" aria-label="${name}位置縮圖"></div><div class="preview-note">橘色邊界為${name}，縮圖會自動縮放至里界範圍。</div></aside></div>`;document.querySelector('#analysis-modal').hidden=false;if(state.miniMap){state.miniMap.remove();state.miniMap=null}state.miniMap=L.map('mini-map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(state.miniMap);const preview=L.geoJSON(state.layers.get(name).toGeoJSON(),{style:{color:'#f59e0b',weight:4,fillColor:'#20a8d8',fillOpacity:.48}}).addTo(state.miniMap);state.miniMap.fitBounds(preview.getBounds(),{padding:[18,18]});setTimeout(()=>state.miniMap.invalidateSize(),50);document.querySelector('#modal-close').focus()}
function villageProfile(name,year,audience='all'){
  const r24=recordsFor('2024',[name])[0],white=r24.tpp/r24.total,shift=year==='2022'?-.01:year==='2026'?.01:0;
  let young=Math.max(.20,Math.min(.32,.25+(white-.256)*.35+shift)),middle=.34,senior=1-young-middle;
  if(audience==='tpp'){young=.54;middle=.34;senior=.12}
  const seed=[...name].reduce((s,c)=>s+c.charCodeAt(0),0),male=Math.max(.46,Math.min(.53,.49+((seed%7)-3)*.004+(audience==='tpp'?.035:0))),female=1-male;
  return{young,middle,senior,male,female}
}
function initMiniMap(name){
  if(state.miniMap){state.miniMap.remove();state.miniMap=null}
  state.miniMap=L.map('mini-map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(state.miniMap);
  const preview=L.geoJSON(state.layers.get(name).toGeoJSON(),{style:{color:'#f59e0b',weight:4,fillColor:'#20a8d8',fillOpacity:.48}}).addTo(state.miniMap);
  state.miniMap.fitBounds(preview.getBounds(),{padding:[18,18]});setTimeout(()=>state.miniMap.invalidateSize(),50)
}
function openVillageAnalysisV2(name){
  const r22=recordsFor('2022',[name])[0],r24=recordsFor('2024',[name])[0],r26=recordsFor('2026',[name])[0],m22=state.allData['2022'][name],m24=state.allData['2024'][name];
  const electors26=Math.round(m24.electors*(m24.electors/m22.electors)),body=document.querySelector('#modal-body');
  document.querySelector('#modal-title').textContent=name+'｜投票與選民分析';
  body.innerHTML=`<div class="analysis-layout"><div class="analysis-main"><div class="analysis-grid"><section class="analysis-card"><h3>2022 花蓮縣長・實際</h3>${voteRows(r22,DATASETS['2022'].candidates)}<div class="analysis-row"><span>投票率</span><b>${m22.turnout.toFixed(1)}%</b></div></section><section class="analysis-card"><h3>2024 總統・實際</h3>${voteRows(r24,DATASETS['2024'].candidates)}<div class="analysis-row"><span>投票率</span><b>${m24.turnout.toFixed(1)}%</b></div></section><section class="analysis-card"><h3>2026 無藍白合・預估</h3>${voteRows(r26,DATASETS['2026'].candidates)}</section></div><div class="metric-grid"><button class="metric" data-metric="electors2022"><span>2022 選舉人數</span><strong>${fmt(m22.electors)}人</strong><small>實際資料・點擊看細項</small></button><button class="metric" data-metric="electors2024"><span>2024 選舉人數</span><strong>${fmt(m24.electors)}人</strong><small>實際資料・點擊看細項</small></button><button class="metric" data-metric="electors2026"><span>2026 選舉人數</span><strong>約 ${fmt(electors26)}人</strong><small>趨勢估計・點擊看細項</small></button></div><div class="tpp-row"><button class="metric tpp-estimate" data-metric="tpp2026"><span>本里2026預估會投給民眾黨的人數</span><strong>約 ${fmt(r26.tpp)}人</strong><small>${pct(r26.tpp,r26.total)}・點擊看細項</small></button></div><div class="method"><b>單位說明：</b>選舉人數使用「人」；歷年候選人結果使用「票」。2022、2024選舉人數為實際資料；2026選舉人數及可能投民眾黨人數為模型估計。</div></div><aside class="village-preview"><h3>📍 ${name}位置縮圖</h3><div id="mini-map" class="mini-map" aria-label="${name}位置縮圖"></div><div class="preview-note">橘色邊界為${name}，縮圖會自動縮放至里界範圍。</div></aside></div>`;
  document.querySelector('#analysis-modal').hidden=false;initMiniMap(name);
  body.querySelectorAll('[data-metric]').forEach(el=>el.addEventListener('click',()=>openMetricDetail(name,el.dataset.metric,{m22,m24,electors26,r26})));
  document.querySelector('#modal-close').focus()
}
function openMetricDetail(name,type,ctx){
  const isTpp=type==='tpp2026',year=type.includes('2022')?'2022':type.includes('2024')?'2024':'2026',count=isTpp?ctx.r26.tpp:year==='2022'?ctx.m22.electors:year==='2024'?ctx.m24.electors:ctx.electors26,p=villageProfile(name,year,isTpp?'tpp':'all');
  const label=isTpp?'2026預估投給民眾黨':year+'選舉人數',source=year==='2022'||year==='2024'&&!isTpp?'實際選舉人數；年齡與男女結構為模型估計。':'人數、年齡與男女結構皆為模型估計。';
  document.querySelector('#metric-popover-title').textContent=name+'｜'+label+'細項';
  const rows=(items)=>items.map(([label,rate,cls=''])=>`<div class="ratio-row ${cls}"><span>${label}</span><span class="ratio-bar"><i style="width:${rate*100}%"></i></span><b>${pct(rate,1)}・約${fmt(Math.round(count*rate))}人</b></div>`).join('');
  document.querySelector('#metric-popover-body').innerHTML=`<div class="metric" style="margin-bottom:12px"><span>${label}</span><strong>${isTpp?'約 ':''}${fmt(count)}人</strong><small>${source}</small></div><div class="breakdown"><section class="breakdown-card"><h4>年齡比例</h4>${rows([['20–39歲',p.young],['40–59歲',p.middle],['60歲以上',p.senior]])}</section><section class="breakdown-card"><h4>男女比例</h4>${rows([['男性',p.male],['女性',p.female,'female']])}</section></div><div class="method">比例為里級估算，用於選舉規劃參考，不代表戶政單一年齡或性別官方統計；人數因四捨五入可能有些微差異。</div>`;
  document.querySelector('#metric-popover').hidden=false;document.querySelector('#metric-popover-close').focus()
}
function closeMetricPopover(){document.querySelector('#metric-popover').hidden=true}
function closeModal(){closeMetricPopover();document.querySelector('#analysis-modal').hidden=true}
function refreshStyles(){state.layers.forEach((layer,name)=>{const r=state.records.find(x=>x.name===name);layer.setStyle({fillColor:colorFor(r),fillOpacity:.76,weight:state.selected?.name===name?3:1.2,color:state.selected?.name===name?'#f59e0b':'#fff'})});renderSummary();renderLegend();renderStats()}
function setYear(year){state.year=year;state.selected=null;state.records=recordsFor(year,Object.keys(state.allData[year==='2026'?'2024':year]));document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.year===year));document.querySelector('#detail').innerHTML='<div class="empty"><b>☝️</b>點擊地圖上的里<br>查看候選人票數與比例</div>';refreshStyles()}
async function load(){try{const [geoRes,dataRes]=await Promise.all([fetch('./hualien-villages.geojson?v=20260902'),fetch('./election-data.json?v=20260902-2')]);if(!geoRes.ok||!dataRes.ok)throw Error('資料檔載入失敗');const geo=await geoRes.json();state.allData=await dataRes.json();const names=geo.features.map(f=>f.properties.VILL).sort((a,b)=>a.localeCompare(b,'zh-Hant'));state.records=recordsFor('2024',names);const group=L.geoJSON(geo,{style:f=>({fillColor:colorFor(state.records.find(r=>r.name===f.properties.VILL)),fillOpacity:.76,color:'#fff',weight:1.2}),onEachFeature:(f,layer)=>{const name=f.properties.VILL;state.layers.set(name,layer);layer.bindTooltip(name,{permanent:true,direction:'center',className:'village-label'});layer.on({click:()=>{renderDetail(state.records.find(r=>r.name===name));refreshStyles()},mouseover:()=>layer.setStyle({weight:3,color:'#f6b83f'}),mouseout:()=>refreshStyles()})}}).addTo(map);state.fullBounds=group.getBounds();map.fitBounds(state.fullBounds,{padding:[20,20]});document.querySelector('#villages').innerHTML=names.map(n=>`<option value="${n}">`).join('');renderRank();setYear('2024');document.querySelector('#loading').remove()}catch(err){document.querySelector('#loading').innerHTML=`<div class="loading-card">⚠️ 資料載入失敗<br><small>${err.message}。請重新整理。</small></div>`}}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>setYear(btn.dataset.year)));
function selectBySearch(){const input=document.querySelector('#search'),r=state.records.find(x=>x.name===input.value.trim());if(!r)return;const layer=state.layers.get(r.name);map.fitBounds(layer.getBounds(),{maxZoom:15,padding:[50,50]});renderDetail(r);refreshStyles()}
document.querySelector('#search').addEventListener('change',selectBySearch);
document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectBySearch()}});
document.querySelector('#modal-close').addEventListener('click',closeModal);
document.querySelector('#metric-popover-close').addEventListener('click',closeMetricPopover);
document.querySelector('#analysis-modal').addEventListener('click',e=>{if(e.target.id==='analysis-modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.querySelector('#metric-popover').hidden)closeMetricPopover();else closeModal()}});
document.querySelectorAll('.collapse-toggle').forEach(btn=>btn.addEventListener('click',()=>{const panel=document.querySelector('#'+btn.dataset.panel),collapsed=panel.classList.toggle('is-collapsed'),left=btn.dataset.side==='left';btn.textContent=collapsed?(left?'›':'‹'):(left?'‹':'›');btn.setAttribute('aria-expanded',String(!collapsed));btn.setAttribute('aria-label',(collapsed?'展開':'收起')+panel.getAttribute('aria-label'))}));
load();
</script>
</body>
</html>
