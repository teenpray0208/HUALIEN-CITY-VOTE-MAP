function renderRank(){const cs=candidates(),key=state.rankKey in cs?state.rankKey:defaultRankKey(),c=cs[key],rows=[...state.records].sort((a,b)=>b[key]-a[key]),total=rows.reduce((s,r)=>s+r[key],0);state.rankKey=key;document.querySelector('#rank-title').textContent=`${state.year} ${c.short} ${rows.length} 里得票明細`;document.querySelector('#rank-total').textContent=`花蓮市合計 ${fmt(total)} 票・依${c.short}票數排序`;document.querySelector('#rank-list').innerHTML=`<button class="rank-item total-view" data-village="__total" title="回到花蓮市總表"><b>Σ</b><span><strong>總表</strong><span class="mini"><i style="width:100%;background:#0a7d86"></i></span></span><strong>${fmt(total)}票</strong></button>`+rows.map((r,i)=>`<button class="rank-item" data-village="${r.name}" title="${r.name}：${c.short} ${fmt(r[key])}票，得票率 ${pct(r[key],r.total)}"><b>${i+1}</b><span>${r.name}・${c.short}<span class="mini"><i style="width:${pct(r[key],r.total)};background:${c.color}"></i></span></span><strong>${fmt(r[key])}票・${pct(r[key],r.total)}</strong></button>`).join('');rows.forEach((r,i)=>{const layer=state.layers.get(r.name),tip=layer?.getTooltip();if(tip)tip.setContent(`${i+1}｜${r.name}`)});document.querySelectorAll('.rank-item').forEach(el=>{const totalView=el.dataset.village==='__total';el.addEventListener('mouseenter',()=>totalView?showTotalView():focusVillage(el.dataset.village));el.addEventListener('focus',()=>totalView?showTotalView():focusVillage(el.dataset.village));el.addEventListener('click',()=>totalView?showTotalView():focusVillage(el.dataset.village))})}
function wireSummarySelectors(){document.querySelectorAll('[data-rank-year][data-rank-key]').forEach(el=>el.addEventListener('click',()=>selectRankCandidate(el.dataset.rankYear,el.dataset.rankKey)))}
function selectRankCandidate(year,key){state.year=year;state.rankKey=key;state.selected=null;state.records=recordsFor(year,Object.keys(state.allData[year==='2026'?'2024':year]));document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.year===year));renderRank();refreshStyles()}
function safeMapPadding(){const mapRect=map.getContainer().getBoundingClientRect(),pads={left:22,right:22,top:22,bottom:22};['rank-panel','summary-panel','legend-panel'].forEach(id=>{const panel=document.querySelector('#'+id);if(!panel||panel.classList.contains('is-collapsed')||getComputedStyle(panel).display==='none')return;const rect=panel.getBoundingClientRect();if(rect.width>mapRect.width*.7){if(rect.top<mapRect.top+mapRect.height/2)pads.top=Math.max(pads.top,rect.bottom-mapRect.top+16);else pads.bottom=Math.max(pads.bottom,mapRect.bottom-rect.top+16)}else if(rect.left<mapRect.left+mapRect.width/2)pads.left=Math.max(pads.left,rect.right-mapRect.left+16);else pads.right=Math.max(pads.right,mapRect.right-rect.left+16)});const limit=(a,b,total,minimum)=>{const sum=pads[a]+pads[b],max=Math.max(44,total-minimum);if(sum>max){const scale=max/sum;pads[a]*=scale;pads[b]*=scale}};limit('left','right',mapRect.width,180);limit('top','bottom',mapRect.height,150);return{paddingTopLeft:[Math.round(pads.left),Math.round(pads.top)],paddingBottomRight:[Math.round(pads.right),Math.round(pads.bottom)]}}
function centerLayerInView(layer,animate=true){const padding=safeMapPadding();map[animate?'flyToBounds':'fitBounds'](layer.getBounds(),{maxZoom:15,...padding,...(animate?{duration:.45}:{})})}
function focusVillage(name){const layer=state.layers.get(name),r=state.records.find(x=>x.name===name);if(!layer||!r)return;state.selected=r;centerLayerInView(layer);refreshMapStyles();layer.bringToFront();renderVillageSummary(r);renderDetail(r)}
function showTotalView(){state.selected=null;if(state.fullBounds){const padding=safeMapPadding();map.flyToBounds(state.fullBounds,{...padding,duration:.45})}refreshMapStyles();renderSummary();document.querySelector('#detail').innerHTML='<div class="empty"><b>📊</b>花蓮市總表<br>移到左下任一里查看該里資料</div>'}
function voteRows(r,cs){return Object.keys(cs).sort((a,b)=>r[b]-r[a]).map(k=>`<div class="analysis-row"><span><i class="dot" style="background:${cs[k].color}"></i>${cs[k].short}</span><b>${fmt(r[k])}・${pct(r[k],r.total)}</b></div>`).join('')}
function openVillageAnalysis(name){const r22=recordsFor('2022',[name])[0],r24=recordsFor('2024',[name])[0],r26=recordsFor('2026',[name])[0],meta=state.allData['2022'][name];const tpp24=r24.tpp/r24.total,young=Math.max(.20,Math.min(.31,.25+(tpp24-.256)*.35)),middle=.34,senior=1-young-middle;const firstTime=Math.round(meta.electors*.048),potential=r26.tpp/r26.total,low=Math.max(0,potential-.04),high=Math.min(1,potential+.04),body=document.querySelector('#modal-body');document.querySelector('#modal-title').textContent=name+'｜投票與選民分析';body.innerHTML=`<div class="analysis-layout"><div class="analysis-main"><div class="analysis-grid"><section class="analysis-card"><h3>2022 花蓮縣長・實際</h3>${voteRows(r22,DATASETS['2022'].candidates)}<div class="analysis-row"><span>投票率</span><b>${meta.turnout.toFixed(1)}%</b></div></section><section class="analysis-card"><h3>2024 總統・實際</h3>${voteRows(r24,DATASETS['2024'].candidates)}</section><section class="analysis-card"><h3>2026 無藍白合・預估</h3>${voteRows(r26,DATASETS['2026'].candidates)}</section></div><div class="metric-grid"><div class="metric"><span>2022 選舉人數</span><strong>${fmt(meta.electors)}人</strong><small>官方登記選舉人</small></div><div class="metric"><span>2026 首次地方選舉族群</span><strong>約 ${fmt(firstTime)}人</strong><small>推估約占 4.8%</small></div><div class="metric tpp-estimate"><span>可能投民眾黨</span><strong>${pct(r26.tpp,r26.total)}</strong><small>合理區間 ${pct(low,1)}–${pct(high,1)}</small></div></div><section class="analysis-card" style="margin-top:12px"><h3>選民年齡結構（模型估計）</h3><div class="agebar"><i style="width:${young*100}%"></i><i style="width:${middle*100}%"></i><i style="width:${senior*100}%"></i></div><div class="analysis-row"><span>🔵 20–39 歲</span><b>${pct(young,1)}・約 ${fmt(Math.round(meta.electors*young))}人</b></div><div class="analysis-row"><span>🟠 40–59 歲</span><b>${pct(middle,1)}・約 ${fmt(Math.round(meta.electors*middle))}人</b></div><div class="analysis-row"><span>⚫ 60 歲以上</span><b>${pct(senior,1)}・約 ${fmt(Math.round(meta.electors*senior))}人</b></div></section><div class="method"><b>估算方式：</b>2022、2024 票數及 2022 選舉人數為實際資料；年齡結構與首投族為模型估計。首投族以 2022 選舉人數的 4.8% 估算 2026 年首次參與地方選舉者。民眾黨潛在比例以該里 2024 實際白營得票、2022 地方選舉結構及常見民調年齡梯度（20–29 歲約25%、30–39歲約20%、40–49歲約13%、50–59歲約7%、60歲以上約2%）加權，並呈現 ±4 個百分點區間；不是個人層級預測或民調。</div></div><aside class="village-preview"><h3>📍 ${name}位置縮圖</h3><div id="mini-map" class="mini-map" aria-label="${name}位置縮圖"></div><div class="preview-note">橘色邊界為${name}，縮圖會自動縮放至里界範圍。</div></aside></div>`;document.querySelector('#analysis-modal').hidden=false;if(state.miniMap){state.miniMap.remove();state.miniMap=null}state.miniMap=L.map('mini-map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(state.miniMap);const preview=L.geoJSON(state.layers.get(name).toGeoJSON(),{style:{color:'#f59e0b',weight:4,fillColor:'#20a8d8',fillOpacity:.48}}).addTo(state.miniMap);state.miniMap.fitBounds(preview.getBounds(),{padding:[18,18]});setTimeout(()=>state.miniMap.invalidateSize(),50);document.querySelector('#modal-close').focus()}
function villageProfile(name,year,audience='all'){
  const r24=recordsFor('2024',[name])[0],white=r24.tpp/r24.total,shift=year==='2022'?-.01:year==='2026'?.01:0;
  let young=Math.max(.20,Math.min(.32,.25+(white-.256)*.35+shift)),middle=.34,senior=1-young-middle;
  if(audience==='tpp'){young=.54;middle=.34;senior=.12}
  const seed=[...name].reduce((s,c)=>s+c.charCodeAt(0),0),male=Math.max(.46,Math.min(.53,.49+((seed%7)-3)*.004+(audience==='tpp'?.035:0))),female=1-male;
  return{young,middle,senior,male,female}
}
function initMiniMap(name){
  if(state.miniMap){state.miniMap.remove();state.miniMap=null}
  state.miniMap=L.map('mini-map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(state.miniMap);
  const preview=L.geoJSON(state.layers.get(name).toGeoJSON(),{style:{color:'#f59e0b',weight:4,fillColor:'#20a8d8',fillOpacity:.48}}).addTo(state.miniMap);
  state.miniMap.fitBounds(preview.getBounds(),{padding:[18,18]});setTimeout(()=>state.miniMap.invalidateSize(),50)
}
function openVillageAnalysisV2(name){
  const r22=recordsFor('2022',[name])[0],r24=recordsFor('2024',[name])[0],r26=recordsFor('2026',[name])[0],m22=state.allData['2022'][name],m24=state.allData['2024'][name];
  const electors26=Math.round(m24.electors*(m24.electors/m22.electors)),body=document.querySelector('#modal-body');

  document.querySelector('#analysis-modal').hidden=false;initMiniMap(name);
  body.querySelectorAll('[data-metric]').forEach(el=>el.addEventListener('click',()=>openMetricDetail(name,el.dataset.metric,{m22,m24,electors26,r26})));
  document.querySelector('#modal-close').focus()
}
function openMetricDetail(name,type,ctx){
  const isTpp=type==='tpp2026',year=type.includes('2022')?'2022':type.includes('2024')?'2024':'2026',count=isTpp?ctx.r26.tpp:year==='2022'?ctx.m22.electors:year==='2024'?ctx.m24.electors:ctx.electors26,p=villageProfile(name,year,isTpp?'tpp':'all');
  const label=isTpp?'2026預估投給民眾黨':year+'選舉人數',source=year==='2022'||year==='2024'&&!isTpp?'實際選舉人數；年齡與男女結構為模型估計。':'人數、年齡與男女結構皆為模型估計。';
  document.querySelector('#metric-popover-title').textContent=name+'｜'+label+'細項';
  const rows=(items)=>items.map(([label,rate,cls=''])=>`<div class="ratio-row ${cls}"><span>${label}</span><span class="ratio-bar"><i style="width:${rate*100}%"></i></span><b>${pct(rate,1)}・約${fmt(Math.round(count*rate))}人</b></div>`).join('');
  document.querySelector('#metric-popover-body').innerHTML=`<div class="metric" style="margin-bottom:12px"><span>${label}</span><strong>${isTpp?'約 ':''}${fmt(count)}人</strong><small>${source}</small></div><div class="breakdown"><section class="breakdown-card"><h4>年齡比例</h4>${rows([['20–39歲',p.young],['40–59歲',p.middle],['60歲以上',p.senior]])}</section><section class="breakdown-card"><h4>男女比例</h4>${rows([['男性',p.male],['女性',p.female,'female']])}</section></div><div class="method">比例為里級估算，用於選舉規劃參考，不代表戶政單一年齡或性別官方統計；人數因四捨五入可能有些微差異。</div>`;
  document.querySelector('#metric-popover').hidden=false;document.querySelector('#metric-popover-close').focus()
}
function closeMetricPopover(){document.querySelector('#metric-popover').hidden=true}
function closeModal(){closeMetricPopover();document.querySelector('#analysis-modal').hidden=true}
function refreshStyles(){refreshMapStyles();renderSummary();renderLegend();renderStats()}
function setYear(year){state.year=year;state.selected=null;state.records=recordsFor(year,Object.keys(state.allData[year==='2026'?'2024':year]));state.rankKey=year==='2024'||year==='2026'?'tpp':defaultRankKey();document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.year===year));document.querySelector('#detail').innerHTML='<div class="empty"><b>☝️</b>點擊地圖上的里<br>查看候選人票數與比例</div>';renderRank();refreshStyles()}
async function load(){try{const [geoRes,dataRes,populationRes,placeRes]=await Promise.all([fetch('./hualien-villages.geojson?v=20260902'),fetch('./election-data.json?v=20260912'),fetch('./population-data.json?v=20260912'),fetch('./place-data.json?v=20260912')]);if(!geoRes.ok||!dataRes.ok||!populationRes.ok||!placeRes.ok)throw Error('資料檔載入失敗');const geo=await geoRes.json();state.allData=await dataRes.json();state.populationData=await populationRes.json();state.placeData=await placeRes.json();const names=geo.features.map(f=>f.properties.VILL).sort((a,b)=>a.localeCompare(b,'zh-Hant'));state.records=recordsFor('2024',names);const group=L.geoJSON(geo,{style:f=>({fillColor:colorFor(state.records.find(r=>r.name===f.properties.VILL)),fillOpacity:.84,color:'#fff',weight:1.2}),onEachFeature:(f,layer)=>{const name=f.properties.VILL;state.layers.set(name,layer);layer.bindTooltip(name,{permanent:true,direction:'center',className:'village-label'});layer.on({click:()=>focusVillage(name),mouseover:()=>{const r=state.records.find(r=>r.name===name);layer.setStyle({weight:3,color:'#f6b83f'});applyVoteGradient(layer,r)},mouseout:()=>refreshStyles()})}}).addTo(map);state.fullBounds=group.getBounds();map.fitBounds(state.fullBounds,{padding:[20,20]});document.querySelector('#villages').innerHTML=names.map(n=>`<option value="${n}">`).join('');setYear('2024');document.querySelector('#loading').remove()}catch(err){document.querySelector('#loading').innerHTML=`<div class="loading-card">⚠️ 資料載入失敗<br><small>${err.message}。請重新整理。</small></div>`}}

document.querySelectorAll('.collapse-toggle,.summary-reopen').forEach(btn=>btn.addEventListener('click',()=>togglePanel(btn)));
function setPanelWidth(handle,width){const panel=document.querySelector('#'+handle.dataset.resizePanel),min=Number(handle.dataset.minWidth),max=Math.min(Number(handle.dataset.maxWidth),window.innerWidth-28),next=Math.max(min,Math.min(max,width));panel.style.width=next+'px';handle.setAttribute('aria-valuemin',String(min));handle.setAttribute('aria-valuemax',String(max));handle.setAttribute('aria-valuenow',String(Math.round(next)));localStorage.setItem('panel-width-'+panel.id,String(Math.round(next)))}
document.querySelectorAll('.panel-resizer').forEach(handle=>{const panel=document.querySelector('#'+handle.dataset.resizePanel),saved=Number(localStorage.getItem('panel-width-'+panel.id));if(saved)setPanelWidth(handle,saved);handle.addEventListener('pointerdown',event=>{event.preventDefault();handle.setPointerCapture(event.pointerId);handle.classList.add('is-resizing');document.body.classList.add('is-resizing-x');const startX=event.clientX,startWidth=panel.getBoundingClientRect().width,direction=handle.dataset.resizeSide==='left'?-1:1;const move=e=>setPanelWidth(handle,startWidth+(e.clientX-startX)*direction),stop=()=>{handle.classList.remove('is-resizing');document.body.classList.remove('is-resizing-x');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',stop);handle.removeEventListener('pointercancel',stop)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop)});handle.addEventListener('keydown',event=>{if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;event.preventDefault();const edgeMove=event.key==='ArrowRight'?12:-12,direction=handle.dataset.resizeSide==='left'?-1:1;setPanelWidth(handle,panel.getBoundingClientRect().width+edgeMove*direction)})});
function setPanelHeight(handle,height){const panel=document.querySelector('#'+handle.dataset.resizePanel),rect=panel.getBoundingClientRect(),min=Number(handle.dataset.minHeight),available=handle.dataset.resizeSide==='top'?rect.bottom-76:window.innerHeight-rect.top-16,max=Math.min(Number(handle.dataset.maxHeight),available),next=Math.max(min,Math.min(max,height));panel.style.height=next+'px';panel.classList.add('has-custom-height');handle.setAttribute('aria-valuemin',String(min));handle.setAttribute('aria-valuemax',String(Math.round(max)));handle.setAttribute('aria-valuenow',String(Math.round(next)));localStorage.setItem('panel-height-'+panel.id,String(Math.round(next)))}
document.querySelectorAll('.panel-v-resizer').forEach(handle=>{const panel=document.querySelector('#'+handle.dataset.resizePanel),saved=Number(localStorage.getItem('panel-height-'+panel.id));if(saved)setPanelHeight(handle,saved);handle.addEventListener('pointerdown',event=>{event.preventDefault();handle.setPointerCapture(event.pointerId);handle.classList.add('is-resizing');document.body.classList.add('is-resizing-y');const startY=event.clientY,startHeight=panel.getBoundingClientRect().height,direction=handle.dataset.resizeSide==='top'?-1:1;const move=e=>setPanelHeight(handle,startHeight+(e.clientY-startY)*direction),stop=()=>{handle.classList.remove('is-resizing');document.body.classList.remove('is-resizing-y');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',stop);handle.removeEventListener('pointercancel',stop)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop)});handle.addEventListener('keydown',event=>{if(event.key!=='ArrowUp'&&event.key!=='ArrowDown')return;event.preventDefault();const edgeMove=event.key==='ArrowDown'?12:-12,direction=handle.dataset.resizeSide==='top'?-1:1;setPanelHeight(handle,panel.getBoundingClientRect().height+edgeMove*direction)})});
load();
