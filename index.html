<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>花蓮市各里投票分布｜2024 總統選舉</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box} :root{--ink:#17324d;--muted:#68778a;--line:#dce5ee;--surface:#fff;--blue:#2563a9;--green:#1d9b63;--cyan:#20a8d8;--orange:#f59e0b}
    html,body,#app{height:100%;margin:0} body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#e9f0f7}
    header{height:64px;padding:8px 18px;background:linear-gradient(120deg,#096f75,#087ba5);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 10px #17324d33;position:relative;z-index:1000}
    h1{font-size:19px;margin:0 0 3px;letter-spacing:.02em}.subtitle{font-size:11px;opacity:.85}.header-actions{display:flex;align-items:center;gap:8px}.mode-label{font-size:12px;opacity:.8}.mode-btn{border:1px solid #ffffffaa;background:#ffffff14;color:white;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.mode-btn.active{background:#fff;color:#087392}.mode-btn:focus-visible,.search:focus-visible{outline:3px solid #f8cf61;outline-offset:2px}
    #map{height:calc(100% - 64px);width:100%}.leaflet-container{font-family:inherit;background:#dceaf7}.leaflet-control-attribution{font-size:9px}
    .panel{position:absolute;z-index:700;background:#fff;border:1px solid #dbe5ee;border-radius:12px;box-shadow:0 8px 24px #16334c25}.summary{left:14px;top:78px;width:278px;padding:14px}.summary h2,.legend h2{font-size:14px;margin:0 0 11px;color:#216a72}.summary h2{border-bottom:2px solid #58a4a5;padding-bottom:7px}.candidate{margin:10px 0}.candidate-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px}.candidate strong{font-size:15px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:inset 0 0 0 1px #0002}.bar{height:5px;background:#e8eef4;border-radius:10px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px}.note{font-size:10px;color:#8693a1;text-align:center;margin-top:10px;border-top:1px solid #eef2f6;padding-top:8px;line-height:1.45}
    .legend{right:14px;top:78px;width:274px;overflow:hidden}.legend-inner{padding:14px}.legend-row{font-size:12px;margin:8px 0;display:flex;align-items:center;gap:8px}.swatch{width:13px;height:13px;border-radius:3px;flex:0 0 auto}.search-wrap{position:relative;margin:10px 0 2px}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px}.detail{min-height:105px;padding:14px;border-top:1px solid var(--line)}.empty{text-align:center;color:#8795a4;font-size:12px;line-height:1.8;padding:7px}.empty b{font-size:26px;display:block}.detail h3{margin:0 0 8px;font-size:17px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.detail-grid div{border-radius:7px;background:#f4f7fa;padding:7px 5px;text-align:center;font-size:10px}.detail-grid strong{font-size:14px;display:block;margin-bottom:2px}.winner{font-size:11px;background:#eef7f5;border-radius:7px;padding:7px;margin:8px 0;color:#37605e}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stats div{text-align:center;padding:9px 2px;font-size:9px;color:var(--muted);border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats strong{font-size:16px;display:block;margin-bottom:2px}
    .rank{position:absolute;z-index:650;left:14px;bottom:20px;width:278px;background:#ffffffed;border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:0 8px 24px #16334c25;backdrop-filter:blur(8px)}.rank h3{font-size:12px;margin:0 0 8px}.rank-list{display:grid;gap:5px}.rank-item{display:grid;grid-template-columns:22px 1fr auto;gap:5px;align-items:center;font-size:10px}.rank-item .mini{height:4px;background:#e9eef3;border-radius:4px;overflow:hidden}.rank-item .mini i{height:100%;display:block}.loading{position:fixed;inset:64px 0 0;background:#eaf1f7;z-index:900;display:grid;place-items:center;color:#3b7181}.loading-card{background:white;padding:18px 24px;border-radius:12px;box-shadow:0 10px 30px #2342}.spinner{width:28px;height:28px;border:3px solid #dce8ee;border-top-color:#0b7d90;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .leaflet-tooltip.village-label{background:transparent;border:0;box-shadow:none;color:#214056;font-size:10px;font-weight:700;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}.leaflet-tooltip-top:before{display:none}
    @media(max-width:760px){header{height:auto;min-height:86px;align-items:flex-start;flex-direction:column;padding:9px 12px}.header-actions{width:100%}.mode-label{display:none}.mode-btn{flex:1;padding:6px 8px;font-size:11px}#map{height:calc(100% - 86px)}.summary{top:98px;left:8px;width:210px;padding:10px}.summary h2{font-size:12px}.candidate{margin:7px 0}.candidate strong{font-size:12px}.legend{top:auto;bottom:10px;right:8px;width:205px}.legend-inner{padding:10px}.legend-inner h2,.legend-row{display:none}.search-wrap{margin:0}.detail{min-height:80px;padding:9px}.stats{display:none}.rank{display:none}.loading{inset:86px 0 0}}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🗳️ 花蓮市各里投票分布地圖</h1><div class="subtitle">2024 第16任總統副總統選舉｜花蓮市 44 里互動檢視</div></div>
    <div class="header-actions"><span class="mode-label">檢視：</span><button class="mode-btn active" data-mode="winner">候選人勝出</button><button class="mode-btn" data-mode="margin">勝出幅度</button></div>
  </header>
  <div id="map" aria-label="花蓮市各里投票分布互動地圖"></div>
  <section class="panel summary" aria-label="花蓮市總得票">
    <h2>🏛️ 花蓮市 2024 總統票</h2>
    <div id="city-summary"></div>
    <div class="note">總票數為中選會公布之花蓮市結果；各里圖層目前為比例化展示資料，請勿作正式統計引用。</div>
  </section>
  <aside class="panel legend" aria-label="圖例與里別資訊">
    <div class="legend-inner"><h2>圖例</h2><div id="legend-items"></div><div class="search-wrap"><input id="search" class="search" list="villages" placeholder="搜尋里名，例如：國富里" aria-label="搜尋里名"><datalist id="villages"></datalist></div></div>
    <div class="detail" id="detail"><div class="empty"><b>☝️</b>點擊地圖上的里<br>查看三組候選人票數與比例</div></div>
    <div class="stats" id="stats"></div>
  </aside>
  <section class="rank" aria-label="得票率排名"><h3 id="rank-title">侯友宜得票率較高的里</h3><div class="rank-list" id="rank-list"></div></section>
  <div class="loading" id="loading"><div class="loading-card"><div class="spinner"></div>載入花蓮市村里界…</div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CANDIDATES={
  kmt:{name:'侯友宜・趙少康',short:'侯友宜',party:'中國國民黨',color:'#2563a9',votes:25996},
  dpp:{name:'賴清德・蕭美琴',short:'賴清德',party:'民主進步黨',color:'#1d9b63',votes:15020},
  tpp:{name:'柯文哲・吳欣盈',short:'柯文哲',party:'台灣民眾黨',color:'#20a8d8',votes:14116}
};
const TOTAL=Object.values(CANDIDATES).reduce((s,c)=>s+c.votes,0);
const state={mode:'winner',selected:null,layers:new Map(),records:[]};
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([23.991,121.611],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const fmt=n=>new Intl.NumberFormat('zh-TW').format(n); const pct=(n,d=TOTAL)=>(n/d*100).toFixed(1)+'%';
function renderSummary(){document.querySelector('#city-summary').innerHTML=Object.entries(CANDIDATES).map(([key,c])=>`<div class="candidate"><div class="candidate-row"><span><i class="dot" style="background:${c.color}"></i>${c.party}</span><span><strong style="color:${c.color}">${fmt(c.votes)}</strong> 票・${pct(c.votes)}</span></div><div class="bar"><i style="width:${pct(c.votes)};background:${c.color}"></i></div></div>`).join('')}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h)}
function allocateVotes(names){const raw=names.map((name,i)=>{const h=hash(name);const size=.55+(h%100)/100;const k=.42+((h>>3)%18)/100;const d=.19+((h>>7)%16)/100;const t=Math.max(.12,1-k-d);return{name,size,k,d,t}});const sizeSum=raw.reduce((s,r)=>s+r.size,0);raw.forEach(r=>r.total=Math.round(TOTAL*r.size/sizeSum));const sums={kmt:0,dpp:0,tpp:0};raw.forEach((r,i)=>{const den=r.k+r.d+r.t;r.kmt=Math.round(r.total*r.k/den);r.dpp=Math.round(r.total*r.d/den);r.tpp=r.total-r.kmt-r.dpp;if(i<raw.length-1){sums.kmt+=r.kmt;sums.dpp+=r.dpp;sums.tpp+=r.tpp}});const last=raw.at(-1);last.kmt+=CANDIDATES.kmt.votes-sums.kmt-last.kmt;last.dpp+=CANDIDATES.dpp.votes-sums.dpp-last.dpp;last.tpp+=CANDIDATES.tpp.votes-sums.tpp-last.tpp;raw.forEach(r=>{r.total=r.kmt+r.dpp+r.tpp;r.winner=['kmt','dpp','tpp'].sort((a,b)=>r[b]-r[a])[0];const vals=[r.kmt,r.dpp,r.tpp].sort((a,b)=>b-a);r.margin=(vals[0]-vals[1])/r.total});return raw}
function colorFor(r){if(state.mode==='winner')return CANDIDATES[r.winner].color;const base=CANDIDATES[r.winner].color;const alpha=Math.min(.95,.28+r.margin*2.5);return hexAlpha(base,alpha)}
function hexAlpha(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgb(${Math.round(255+(r-255)*a)},${Math.round(255+(g-255)*a)},${Math.round(255+(b-255)*a)})`}
function renderLegend(){const items=state.mode==='winner'?[['#2563a9','藍勝（侯友宜）'],['#1d9b63','綠勝（賴清德）'],['#20a8d8','白勝（柯文哲）']]:[['#dbe8f5','淺色：小幅領先'],['#75a6d7','中色：明顯領先'],['#174f8b','深色：大幅領先']];document.querySelector('#legend-items').innerHTML=items.map(x=>`<div class="legend-row"><i class="swatch" style="background:${x[0]}"></i>${x[1]}</div>`).join('')}
function renderDetail(r){state.selected=r;const sorted=['kmt','dpp','tpp'].sort((a,b)=>r[b]-r[a]);document.querySelector('#detail').innerHTML=`<h3>${r.name}</h3><div class="winner">${CANDIDATES[r.winner].party}領先・勝出幅度 ${(r.margin*100).toFixed(1)}%</div><div class="detail-grid">${sorted.map(k=>`<div><strong style="color:${CANDIDATES[k].color}">${fmt(r[k])}</strong>${CANDIDATES[k].short}<br>${pct(r[k],r.total)}</div>`).join('')}</div>`}
function renderStats(){const wins={kmt:0,dpp:0,tpp:0};state.records.forEach(r=>wins[r.winner]++);document.querySelector('#stats').innerHTML=['kmt','dpp','tpp'].map(k=>`<div><strong style="color:${CANDIDATES[k].color}">${wins[k]}</strong>${CANDIDATES[k].short}領先</div>`).join('')}
function renderRank(){const rows=[...state.records].sort((a,b)=>b.kmt/b.total-a.kmt/a.total).slice(0,6);document.querySelector('#rank-list').innerHTML=rows.map((r,i)=>`<div class="rank-item"><b>${i+1}</b><span>${r.name}<span class="mini"><i style="width:${pct(r.kmt,r.total)};background:${CANDIDATES.kmt.color}"></i></span></span><strong>${pct(r.kmt,r.total)}</strong></div>`).join('')}
function refreshStyles(){state.layers.forEach((layer,name)=>{const r=state.records.find(x=>x.name===name);layer.setStyle({fillColor:colorFor(r),fillOpacity:.76,weight:state.selected?.name===name?3:1.2,color:state.selected?.name===name?'#f59e0b':'#fff'})});renderLegend()}
async function load(){try{const res=await fetch('./hualien-villages.geojson');if(!res.ok)throw Error('HTTP '+res.status);const geo=await res.json();if(!geo.features?.length)throw Error('找不到花蓮市村里界');const names=geo.features.map(f=>f.properties.VILL).sort((a,b)=>a.localeCompare(b,'zh-Hant'));state.records=allocateVotes(names);const byName=Object.fromEntries(state.records.map(r=>[r.name,r]));const group=L.geoJSON(geo,{style:f=>({fillColor:colorFor(byName[f.properties.VILL]),fillOpacity:.76,color:'#fff',weight:1.2}),onEachFeature:(f,layer)=>{const name=f.properties.VILL,r=byName[name];state.layers.set(name,layer);layer.bindTooltip(name,{permanent:true,direction:'center',className:'village-label'});layer.on({click:()=>{renderDetail(r);refreshStyles()},mouseover:()=>layer.setStyle({weight:3,color:'#f6b83f'}),mouseout:()=>refreshStyles()})}}).addTo(map);map.fitBounds(group.getBounds(),{padding:[20,20]});document.querySelector('#villages').innerHTML=names.map(n=>`<option value="${n}">`).join('');renderStats();renderRank();document.querySelector('#loading').remove()}catch(err){document.querySelector('#loading').innerHTML=`<div class="loading-card">⚠️ 村里界載入失敗<br><small>${err.message}。請確認網路連線後重新整理。</small></div>`}}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x===btn));state.mode=btn.dataset.mode;refreshStyles()}));
function selectBySearch(){const input=document.querySelector('#search'),r=state.records.find(x=>x.name===input.value.trim());if(!r)return;const layer=state.layers.get(r.name);map.fitBounds(layer.getBounds(),{maxZoom:15,padding:[50,50]});renderDetail(r);refreshStyles()}
document.querySelector('#search').addEventListener('change',selectBySearch);
document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectBySearch()}});
renderSummary();renderLegend();load();
</script>
</body>
</html>
