<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>花蓮市各里投票分布｜2024 總統選舉</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box} :root{--ink:#17324d;--muted:#68778a;--line:#dce5ee;--surface:#fff;--blue:#2563a9;--green:#1d9b63;--cyan:#20a8d8;--orange:#f59e0b}
    html,body,#app{height:100%;margin:0} body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#e9f0f7}
    header{height:64px;padding:8px 18px;background:linear-gradient(120deg,#096f75,#087ba5);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 10px #17324d33;position:relative;z-index:1000}
    h1{font-size:19px;margin:0 0 3px;letter-spacing:.02em}.subtitle{font-size:11px;opacity:.85}.header-actions{display:flex;align-items:center;gap:8px}.mode-label{font-size:12px;opacity:.8}.mode-btn{border:1px solid #ffffffaa;background:#ffffff14;color:white;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.mode-btn.active{background:#fff;color:#087392}.mode-btn:focus-visible,.search:focus-visible{outline:3px solid #f8cf61;outline-offset:2px}
    #map{height:calc(100% - 64px);width:100%}.leaflet-container{font-family:inherit;background:#dceaf7}.leaflet-control-attribution{font-size:9px}
    .panel{position:absolute;z-index:700;background:#fff;border:1px solid #dbe5ee;border-radius:12px;box-shadow:0 8px 24px #16334c25}.summary{left:14px;top:78px;width:278px;padding:14px}.summary h2,.legend h2{font-size:14px;margin:0 0 11px;color:#216a72}.summary h2{border-bottom:2px solid #58a4a5;padding-bottom:7px}.candidate{margin:10px 0}.candidate-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px}.candidate strong{font-size:15px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;box-shadow:inset 0 0 0 1px #0002}.bar{height:5px;background:#e8eef4;border-radius:10px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px}.note{font-size:10px;color:#8693a1;text-align:center;margin-top:10px;border-top:1px solid #eef2f6;padding-top:8px;line-height:1.45}
    .legend{right:14px;top:78px;width:274px;overflow:hidden}.legend-inner{padding:14px}.legend-row{font-size:12px;margin:8px 0;display:flex;align-items:center;gap:8px}.swatch{width:13px;height:13px;border-radius:3px;flex:0 0 auto}.search-wrap{position:relative;margin:10px 0 2px}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px}.detail{min-height:105px;padding:14px;border-top:1px solid var(--line)}.empty{text-align:center;color:#8795a4;font-size:12px;line-height:1.8;padding:7px}.empty b{font-size:26px;display:block}.detail h3{margin:0 0 8px;font-size:17px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.detail-grid div{border-radius:7px;background:#f4f7fa;padding:7px 5px;text-align:center;font-size:10px}.detail-grid strong{font-size:14px;display:block;margin-bottom:2px}.winner{font-size:11px;background:#eef7f5;border-radius:7px;padding:7px;margin:8px 0;color:#37605e}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stats div{text-align:center;padding:9px 2px;font-size:9px;color:var(--muted);border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats strong{font-size:16px;display:block;margin-bottom:2px}
    .rank{position:absolute;z-index:650;left:14px;bottom:20px;width:278px;background:#ffffffed;border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:0 8px 24px #16334c25;backdrop-filter:blur(8px)}.rank h3{font-size:12px;margin:0 0 8px}.rank-list{display:grid;gap:5px}.rank-item{display:grid;grid-template-columns:22px 1fr auto;gap:5px;align-items:center;font-size:10px}.rank-item .mini{height:4px;background:#e9eef3;border-radius:4px;overflow:hidden}.rank-item .mini i{height:100%;display:block}.loading{position:fixed;inset:64px 0 0;background:#eaf1f7;z-index:900;display:grid;place-items:center;color:#3b7181}.loading-card{background:white;padding:18px 24px;border-radius:12px;box-shadow:0 10px 30px #2342}.spinner{width:28px;height:28px;border:3px solid #dce8ee;border-top-color:#0b7d90;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .leaflet-tooltip.village-label{background:transparent;border:0;box-shadow:none;color:#214056;font-size:10px;font-weight:700;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}.leaflet-tooltip-top:before{display:none}
    @media(max-width:760px){header{height:auto;min-height:86px;align-items:flex-start;flex-direction:column;padding:9px 12px}.header-actions{width:100%}.mode-label{display:none}.mode-btn{flex:1;padding:6px 8px;font-size:11px}#map{height:calc(100% - 86px)}.summary{top:98px;left:8px;width:210px;padding:10px}.summary h2{font-size:12px}.candidate{margin:7px 0}.candidate strong{font-size:12px}.legend{top:auto;bottom:10px;right:8px;width:205px}.legend-inner{padding:10px}.legend-inner h2,.legend-row{display:none}.search-wrap{margin:0}.detail{min-height:80px;padding:9px}.stats{display:none}.rank{display:none}.loading{inset:86px 0 0}}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🗳️ 花蓮市各里投票分布地圖</h1><div class="subtitle">2024 第16任總統副總統選舉｜花蓮市 44 里互動檢視</div></div>
    <div class="header-actions"><span class="mode-label">選舉：</span><button class="mode-btn" data-year="2022">2022 縣長</button><button class="mode-btn active" data-year="2024">2024 總統</button><button class="mode-btn" data-year="2026">2026 預估</button></div>
  </header>
  <div id="map" aria-label="花蓮市各里投票分布互動地圖"></div>
  <section class="panel summary" aria-label="花蓮市總得票">
    <h2 id="summary-title">🏛️ 花蓮市 2024 總統票</h2>
    <div id="city-summary"></div>
    <div class="note" id="data-note"></div>
  </section>
  <aside class="panel legend" aria-label="圖例與里別資訊">
    <div class="legend-inner"><h2>圖例</h2><div id="legend-items"></div><div class="search-wrap"><input id="search" class="search" list="villages" placeholder="搜尋里名，例如：國富里" aria-label="搜尋里名"><datalist id="villages"></datalist></div></div>
    <div class="detail" id="detail"><div class="empty"><b>☝️</b>點擊地圖上的里<br>查看三組候選人票數與比例</div></div>
    <div class="stats" id="stats"></div>
  </aside>
  <section class="rank" aria-label="民眾黨得票排名"><h3 id="rank-title">2024 民眾黨得票最多的里</h3><div class="rank-list" id="rank-list"></div></section>
  <div class="loading" id="loading"><div class="loading-card"><div class="spinner"></div>載入花蓮市村里界…</div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATASETS={
  2022:{title:'花蓮市 2022 縣長票',subtitle:'2022 花蓮縣長選舉｜花蓮市 44 里實際開票',note:'實際結果｜資料來源：中央選舉委員會／VoteTW 里級彙整。',candidates:{kmt:{short:'徐榛蔚',party:'中國國民黨',color:'#2563a9'},other:{short:'黃師鵬',party:'無黨籍',color:'#7c8795'},dpp:{short:'Kolas',party:'民主進步黨',color:'#1d9b63'}}},
  2024:{title:'花蓮市 2024 總統票',subtitle:'2024 第16任總統副總統選舉｜花蓮市 44 里實際開票',note:'實際結果｜資料來源：中央選舉委員會／VoteTW 里級彙整。',candidates:{kmt:{short:'侯友宜',party:'中國國民黨',color:'#2563a9'},dpp:{short:'賴清德',party:'民主進步黨',color:'#1d9b63'},tpp:{short:'柯文哲',party:'台灣民眾黨',color:'#20a8d8'}}},
  2026:{title:'花蓮市 2026 選情預估',subtitle:'2026 花蓮地方選舉預估｜藍、綠、白各自參選（無藍白合）',note:'模型推估，非民調｜綜合 2022 縣長與 2024 總統各里政黨基礎；假設藍、綠、白各自參選。',candidates:{kmt:{short:'國民黨',party:'中國國民黨',color:'#2563a9'},dpp:{short:'民進黨',party:'民主進步黨',color:'#1d9b63'},tpp:{short:'民眾黨',party:'台灣民眾黨',color:'#20a8d8'}}}
};
const state={year:'2024',selected:null,layers:new Map(),records:[],allData:{}};
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([23.991,121.611],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const fmt=n=>new Intl.NumberFormat('zh-TW').format(n); const pct=(n,d)=>(n/d*100).toFixed(1)+'%';
const candidates=()=>DATASETS[state.year].candidates;
function enrich(name,votes){const keys=Object.keys(votes),total=keys.reduce((s,k)=>s+votes[k],0),winner=[...keys].sort((a,b)=>votes[b]-votes[a])[0],vals=keys.map(k=>votes[k]).sort((a,b)=>b-a);return{name,...votes,total,winner,margin:(vals[0]-vals[1])/total}}
function project2026(name,v22,v24){const t22=Object.values(v22).reduce((a,b)=>a+b,0),t24=Object.values(v24).reduce((a,b)=>a+b,0);const scores={kmt:.58*v24.kmt/t24+.42*v22.kmt/t22,dpp:.58*v24.dpp/t24+.42*v22.dpp/t22,tpp:.78*v24.tpp/t24};const den=Object.values(scores).reduce((a,b)=>a+b,0),total=Math.round(t24*.94);const votes={kmt:Math.round(total*scores.kmt/den),dpp:Math.round(total*scores.dpp/den),tpp:0};votes.tpp=total-votes.kmt-votes.dpp;return enrich(name,votes)}
function recordsFor(year,names){if(year==='2026')return names.map(n=>project2026(n,state.allData['2022'][n],state.allData['2024'][n]));return names.map(n=>enrich(n,state.allData[year][n]))}
function renderSummary(){const cs=candidates(),total=state.records.reduce((s,r)=>s+r.total,0),totals=Object.fromEntries(Object.keys(cs).map(k=>[k,state.records.reduce((s,r)=>s+r[k],0)]));document.querySelector('#summary-title').textContent='🏛️ '+DATASETS[state.year].title;document.querySelector('.subtitle').textContent=DATASETS[state.year].subtitle;document.querySelector('#data-note').textContent=DATASETS[state.year].note;document.querySelector('#city-summary').innerHTML=Object.entries(cs).map(([k,c])=>`<div class="candidate"><div class="candidate-row"><span><i class="dot" style="background:${c.color}"></i>${c.party}</span><span><strong style="color:${c.color}">${fmt(totals[k])}</strong> 票・${pct(totals[k],total)}</span></div><div class="bar"><i style="width:${pct(totals[k],total)};background:${c.color}"></i></div></div>`).join('')}
function colorFor(r){return candidates()[r.winner].color}
function renderLegend(){document.querySelector('#legend-items').innerHTML=Object.values(candidates()).map(c=>`<div class="legend-row"><i class="swatch" style="background:${c.color}"></i>${c.short}領先</div>`).join('')}
function renderDetail(r){state.selected=r;const cs=candidates(),sorted=Object.keys(cs).sort((a,b)=>r[b]-r[a]);document.querySelector('#detail').innerHTML=`<h3>${r.name}</h3><div class="winner">${cs[r.winner].party}領先・勝出幅度 ${(r.margin*100).toFixed(1)}%${state.year==='2026'?'（模型預估）':''}</div><div class="detail-grid">${sorted.map(k=>`<div><strong style="color:${cs[k].color}">${fmt(r[k])}</strong>${cs[k].short}<br>${pct(r[k],r.total)}</div>`).join('')}</div>`}
function renderStats(){const cs=candidates(),wins=Object.fromEntries(Object.keys(cs).map(k=>[k,0]));state.records.forEach(r=>wins[r.winner]++);document.querySelector('#stats').innerHTML=Object.keys(cs).map(k=>`<div><strong style="color:${cs[k].color}">${wins[k]}</strong>${cs[k].short}領先</div>`).join('')}
function renderRank(){const rows=recordsFor('2024',Object.keys(state.allData['2024'])).sort((a,b)=>b.tpp-a.tpp).slice(0,6);document.querySelector('#rank-list').innerHTML=rows.map((r,i)=>`<div class="rank-item"><b>${i+1}</b><span>${r.name}<span class="mini"><i style="width:${pct(r.tpp,r.total)};background:#20a8d8"></i></span></span><strong>${fmt(r.tpp)}票</strong></div>`).join('')}
function refreshStyles(){state.layers.forEach((layer,name)=>{const r=state.records.find(x=>x.name===name);layer.setStyle({fillColor:colorFor(r),fillOpacity:.76,weight:state.selected?.name===name?3:1.2,color:state.selected?.name===name?'#f59e0b':'#fff'})});renderSummary();renderLegend();renderStats()}
function setYear(year){state.year=year;state.selected=null;state.records=recordsFor(year,Object.keys(state.allData[year==='2026'?'2024':year]));document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.year===year));document.querySelector('#detail').innerHTML='<div class="empty"><b>☝️</b>點擊地圖上的里<br>查看候選人票數與比例</div>';refreshStyles()}
async function load(){try{const [geoRes,dataRes]=await Promise.all([fetch('./hualien-villages.geojson'),fetch('./election-data.json')]);if(!geoRes.ok||!dataRes.ok)throw Error('資料檔載入失敗');const geo=await geoRes.json();state.allData=await dataRes.json();const names=geo.features.map(f=>f.properties.VILL).sort((a,b)=>a.localeCompare(b,'zh-Hant'));state.records=recordsFor('2024',names);const group=L.geoJSON(geo,{style:f=>({fillColor:colorFor(state.records.find(r=>r.name===f.properties.VILL)),fillOpacity:.76,color:'#fff',weight:1.2}),onEachFeature:(f,layer)=>{const name=f.properties.VILL;state.layers.set(name,layer);layer.bindTooltip(name,{permanent:true,direction:'center',className:'village-label'});layer.on({click:()=>{renderDetail(state.records.find(r=>r.name===name));refreshStyles()},mouseover:()=>layer.setStyle({weight:3,color:'#f6b83f'}),mouseout:()=>refreshStyles()})}}).addTo(map);map.fitBounds(group.getBounds(),{padding:[20,20]});document.querySelector('#villages').innerHTML=names.map(n=>`<option value="${n}">`).join('');renderRank();setYear('2024');document.querySelector('#loading').remove()}catch(err){document.querySelector('#loading').innerHTML=`<div class="loading-card">⚠️ 資料載入失敗<br><small>${err.message}。請重新整理。</small></div>`}}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>setYear(btn.dataset.year)));
function selectBySearch(){const input=document.querySelector('#search'),r=state.records.find(x=>x.name===input.value.trim());if(!r)return;const layer=state.layers.get(r.name);map.fitBounds(layer.getBounds(),{maxZoom:15,padding:[50,50]});renderDetail(r);refreshStyles()}
document.querySelector('#search').addEventListener('change',selectBySearch);
document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectBySearch()}});
load();
</script>
</body>
</html>
